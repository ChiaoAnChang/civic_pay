[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "civicpay"
dynamic = ["version"]
description = "CivicPay Open Framework — clean-room, open-source reference implementation of financial-data-governance methodology (reconciliation, data quality, exception workflow, audit evidence)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "CivicPay Open Framework contributors" }]
keywords = ["finance", "reconciliation", "data-quality", "audit", "duckdb", "open-source"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
]
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.1.0",
    "faker>=24.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.9.0",
    "streamlit>=1.36.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
dbt = [
    "dbt-core>=1.12.0",
    "dbt-duckdb>=1.11.0",
]

[project.scripts]
civicpay = "civicpay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["civicpay"]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "civicpay/_version.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["civicpay", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]  # E501 handled by formatter; B008 is the Typer Option-in-default idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
