# Enrollment validation rules (Ticket 13). Declarative, not hard-coded, so
# thresholds are configurable and obviously synthetic — original design, not
# derived from any real incentive/rebate program.
#
# programs: program_code -> { max_incentive_amount, term_months: {min, max} }
# regions: allowed region enum
# min_enrollment_date: earliest allowed enrollment_date (YYYY-MM-DD)
# dual_source_tolerance: max allowed |method_a - method_b| delta to agree

programs:
  STARTER:
    max_incentive_amount: 5000
    term_months: { min: 1, max: 12 }
  GROWTH:
    max_incentive_amount: 25000
    term_months: { min: 6, max: 36 }
  ENTERPRISE:
    max_incentive_amount: 100000
    term_months: { min: 12, max: 60 }

regions:
  - NORTHEAST
  - SOUTHEAST
  - MIDWEST
  - SOUTHWEST
  - WEST

min_enrollment_date: "2020-01-01"

dual_source_tolerance: 0.01
