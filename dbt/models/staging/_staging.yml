version: 2

models:
  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]

  - name: stg_payment_records
    columns:
      - name: payment_id
        data_tests: [not_null, unique]

  - name: stg_reconciliation_results
    columns:
      - name: recon_id
        data_tests: [not_null, unique]
      - name: match_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['matched', 'unmatched_payment', 'unmatched_ledger', 'exception']

  - name: stg_dq_results
    columns:
      - name: dq_check_id
        data_tests: [not_null, unique]
      - name: check_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['completeness', 'accuracy', 'consistency', 'timeliness', 'anomaly']

  - name: stg_exception_queue
    columns:
      - name: exception_id
        data_tests: [not_null, unique]
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'in_progress', 'resolved']

  - name: stg_pending_enrollments
    columns:
      - name: enrollment_id
        data_tests: [not_null, unique]
